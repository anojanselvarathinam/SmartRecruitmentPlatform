<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Seeker Profile</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../css/jobseeker/jobseeker.css"></head><body><div class="portal"><aside class="sidebar"><div class="brand">Smart<span>Recruitment</span></div><ul class="nav"><li><a href="dashboard.html">▣ Dashboard</a></li><li><a href="profile.html">👤 My Profile</a></li><li><a href="jobs.html">⌕ Find Jobs</a></li><li><a href="applications.html">📄 Applications</a></li><li><a href="engagement.html">🔔 Requests & Notifications</a></li><li><a href="#" id="jobSeekerLogout">↪ Logout</a></li></ul></aside><main class="main"><header class="topbar"><button id="menuButton" class="menu-button">☰</button><h2>Job Seeker Portal</h2><span class="employer-name">Profile</span></header><section class="content"><div id="pageNotice" class="notice"></div><div class="page-header"><div><h1>My Profile</h1><p>Keep your information current for accurate matching.</p></div></div>
<div class="card profile-section"><h2 class="section-title">Personal Information</h2><form id="profileForm" class="grid form-grid"><div class="field"><label>First name *</label><input id="firstName" required maxlength="100"></div><div class="field"><label>Last name *</label><input id="lastName" required maxlength="100"></div><div class="field"><label>Phone</label><input id="phone" maxlength="30"></div><div class="field"><label>Location</label><input id="location" maxlength="150"></div><div class="field full"><label>Professional summary</label><textarea id="summary" maxlength="2000"></textarea></div><div class="field full"><button class="button button-primary" type="submit">Save Profile</button></div></form></div>
<div class="card profile-section"><h2 class="section-title">Skills</h2><form id="skillForm" class="grid form-grid"><div class="field"><label>Skill *</label><input id="skillName" required maxlength="100"></div><div class="field"><label>Level</label><select id="skillLevel"><option value="">Not specified</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field full"><button class="button button-primary" type="submit">Add Skill</button></div></form><div id="skillsList" class="item-list"></div></div>
<div class="card profile-section"><h2 class="section-title">Education</h2><form id="educationForm" class="grid form-grid"><div class="field"><label>Institution *</label><input id="institution" required></div><div class="field"><label>Degree *</label><input id="degree" required placeholder="Bachelor Degree"></div><div class="field"><label>Field of study</label><input id="fieldOfStudy"></div><div class="field"><label>Start date *</label><input id="educationStart" type="date" required></div><div class="field"><label>End date</label><input id="educationEnd" type="date"></div><div class="field full"><button class="button button-primary" type="submit">Add Education</button></div></form><div id="educationList" class="item-list"></div></div>
<div class="card profile-section"><h2 class="section-title">Experience</h2><form id="experienceForm" class="grid form-grid"><div class="field"><label>Company *</label><input id="experienceCompany" required></div><div class="field"><label>Job title *</label><input id="experienceTitle" required></div><div class="field"><label>Start date *</label><input id="experienceStart" type="date" required></div><div class="field"><label>End date</label><input id="experienceEnd" type="date"></div><div class="field full"><label>Description</label><textarea id="experienceDescription"></textarea></div><div class="field full"><button class="button button-primary" type="submit">Add Experience</button></div></form><div id="experienceList" class="item-list"></div></div>
<div class="card profile-section"><h2 class="section-title">CV Documents</h2><form id="cvForm" class="actions"><input id="cvFile" type="file" accept=".pdf,.doc,.docx" required><button class="button button-primary" type="submit">Upload CV</button></form><div id="cvList" class="item-list"></div></div>
</section></main></div><script src="../../js/jobseeker/jobseeker-common.js"></script><script src="../../js/jobseeker/jobseeker-profile.js"></script></body></html>
