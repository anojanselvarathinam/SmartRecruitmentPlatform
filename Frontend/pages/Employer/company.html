<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../css/employer/employer.css"></head><body>
<div class="portal"><aside class="sidebar"><div class="brand">Smart<span>Recruitment</span></div><ul class="nav"><li><a href="dashboard.html">▣ Dashboard</a></li><li><a href="company.html">🏢 Company Profile</a></li><li><a href="jobs.html">💼 Vacancies</a></li></ul></aside>
<main class="main"><header class="topbar"><button class="menu-button" id="menuButton">☰</button><h2>Employer Portal</h2><span class="employer-name">Company</span></header><section class="content"><div id="pageNotice" class="notice"></div><div class="page-header"><div><h1>Company Profile</h1><p>Create or update the company linked to your Employer account.</p></div></div>
<form id="companyForm" class="card grid form-grid"><div class="field"><label for="companyName">Company name *</label><input id="companyName" maxlength="150" required></div><div class="field"><label for="industry">Industry *</label><input id="industry" maxlength="100" required></div><div class="field"><label for="location">Location *</label><input id="location" maxlength="150" required></div><div class="field"><label for="website">Website</label><input id="website" maxlength="300" placeholder="https://example.com"></div><div class="field full"><label for="description">Description</label><textarea id="description" maxlength="2000"></textarea></div><div class="field full"><div class="actions"><button id="companySubmit" class="button button-primary" type="submit">Save Company</button><a class="button button-secondary" href="dashboard.html">Cancel</a></div></div></form></section></main></div>
<script src="../../js/employer/employer-common.js"></script><script src="../../js/employer/employer-company.js"></script></body></html>
