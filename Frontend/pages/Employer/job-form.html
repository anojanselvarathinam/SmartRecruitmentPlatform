<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vacancy Form</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../css/employer/employer.css"></head><body>
<div class="portal"><aside class="sidebar"><div class="brand">Smart<span>Recruitment</span></div><ul class="nav"><li><a href="dashboard.html">▣ Dashboard</a></li><li><a href="company.html">🏢 Company Profile</a></li><li><a href="jobs.html">💼 Vacancies</a></li><li><a href="#" id="employerLogout">↪ Logout</a></li></ul></aside>
<main class="main"><header class="topbar"><button class="menu-button" id="menuButton">☰</button><h2>Employer Portal</h2><span class="employer-name">Vacancy</span></header><section class="content"><div id="pageNotice" class="notice"></div><div class="page-header"><div><h1 id="formTitle">Post Vacancy</h1><p>Enter clear requirements so candidates receive accurate match scores.</p></div></div>
<form id="jobForm" class="card grid form-grid"><div class="field full"><label for="jobTitle">Job title *</label><input id="jobTitle" maxlength="150" required></div><div class="field"><label for="location">Location *</label><input id="location" maxlength="150" required></div><div class="field"><label for="experience">Required experience (years) *</label><input id="experience" type="number" min="0" max="60" required></div><div class="field"><label for="education">Education *</label><input id="education" maxlength="150" placeholder="Bachelor Degree" required></div><div class="field"><label for="requiredSkills">Required skills *</label><input id="requiredSkills" maxlength="2000" placeholder="C#, SQL, Git" required></div><div class="field full"><label for="description">Description *</label><textarea id="description" maxlength="4000" required></textarea></div><div class="field full" id="activeField" style="display:none"><label><input id="isActive" type="checkbox"> Vacancy is active</label></div><div class="field full"><div class="actions"><button id="jobSubmit" class="button button-primary" type="submit">Save Vacancy</button><a class="button button-secondary" href="jobs.html">Cancel</a></div></div></form></section></main></div>
<script src="../../js/employer/employer-common.js"></script><script src="../../js/employer/employer-job-form.js"></script></body></html>
